<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビート投稿 — L RAP LEGACY BEATS</title>
<style>
  :root{--bg:#0b0b0e;--panel:#141419;--line:#2a2a33;--ink:#f4f4f6;--sub:#a0a0ad;--accent:#c9a227;--accent2:#e7c454;--green:#3ad29f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px}
  .logo{font-weight:900;letter-spacing:.12em;font-size:15px;text-align:center;margin-bottom:6px}
  .logo b{color:var(--accent2)}
  h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
  input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:15px}
  input[type=file]{padding:10px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111;font-weight:800;padding:14px;border-radius:999px;border:none;cursor:pointer;font-size:16px}
  .btn:disabled{opacity:.5}
  .muted{color:var(--sub);font-size:13px;text-align:center;margin-top:14px}
  .msg{padding:12px;border-radius:10px;margin-top:14px;font-size:14px;text-align:center;display:none}
  .ok{background:rgba(58,210,159,.12);border:1px solid var(--green);color:var(--green)}
  .err{background:rgba(229,72,72,.12);border:1px solid #e54848;color:#ff8a8a}
  .hide{display:none}
  a{color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">L RAP LEGACY <b>BEATS</b></div>
  <h1>ビート投稿</h1>

  <div class="card" id="loginCard">
    <label>お名前（誰が上げたか記録に残ります）</label>
    <input id="name" placeholder="例: YAMATO">
    <label>チームの合言葉</label>
    <input id="password" type="password" placeholder="合言葉">
    <button class="btn" onclick="login()">ログイン</button>
    <div class="msg err" id="loginErr"></div>
  </div>

  <div class="card hide" id="uploadCard">
    <div class="muted" id="who"></div>
    <label>投稿者（プロデューサー）</label>
    <select id="uploader"><option value="">選択…</option></select>
    <label>ビートのmp3ファイル</label>
    <input id="file" type="file" accept="audio/mpeg,.mp3">
    <label>タイトル</label>
    <input id="title" placeholder="例: NEON PULSE">
    <label>type beat（任意）</label>
    <select id="typebeat" onchange="onTypeBeatChange()">
      <option value="">指定なし</option>
    </select>
    <input id="typebeatNew" class="hide" style="margin-top:8px" placeholder="新しいtype beat名（例: Travis Scott）">
    <div class="muted" style="text-align:left;margin-top:4px">「Travis Scott」を選ぶと、顧客側で "Travis Scott type beat" としてまとまります。無ければ「＋新しく追加」で登録。</div>
    <div class="row">
      <div><label>ジャンル（任意）</label>
        <select id="genre">
          <option value="">選択…</option>
          <option>Trap</option><option>Boom Bap</option><option>Drill</option><option>Lo-Fi</option>
          <option>Trap Soul</option><option>R&amp;B</option><option>Afrobeat</option><option>Jersey Club</option>
          <option>Pop</option><option>その他</option>
        </select>
      </div>
      <div><label>BPM（任意・自動）</label><input id="bpm" type="number" placeholder="自動判定"></div>
      <div><label>キー（任意）</label>
        <select id="key">
          <option value="">選択…</option>
          <option>C major</option><option>C# major</option><option>D major</option><option>D# major</option><option>E major</option><option>F major</option><option>F# major</option><option>G major</option><option>G# major</option><option>A major</option><option>A# major</option><option>B major</option>
          <option>C minor</option><option>C# minor</option><option>D minor</option><option>D# minor</option><option>E minor</option><option>F minor</option><option>F# minor</option><option>G minor</option><option>G# minor</option><option>A minor</option><option>A# minor</option><option>B minor</option>
        </select>
      </div>
    </div>
    <div class="muted" id="bpmStatus" style="text-align:left;margin-top:2px;min-height:18px"></div>
    <button class="btn" id="submitBtn" onclick="submitBeat()">投稿する（承認待ちになります）</button>
    <div class="msg ok" id="okMsg"></div>
    <div class="msg err" id="errMsg"></div>
    <div class="muted" style="margin-top:16px"><a href="/staff-logout">ログアウト</a></div>
  </div>

  <div class="muted">必須はファイルとタイトルだけ。ジャンル・BPM・キーは任意で、BPMは選ぶと自動で判定します。<br>投稿されたビートは、管理者が承認するとサイトに公開されます。7秒の試聴クリップは自動で作られます。</div>
</div>

<script type="module">
  // ブラウザ側でBPMを自動判定（サーバー負荷ゼロ）。失敗しても無視（BPMは任意）。
  import { analyze } from 'https://esm.sh/web-audio-beat-detector@8';
  const fileEl = document.getElementById('file');
  const bpmEl = document.getElementById('bpm');
  const statusEl = document.getElementById('bpmStatus');
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files[0];
    statusEl.textContent = '';
    if (!f || bpmEl.value) return;
    statusEl.textContent = 'BPMを自動判定中…';
    try {
      const buf = await f.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const audio = await ctx.decodeAudioData(buf);
      const tempo = await analyze(audio);
      bpmEl.value = Math.round(tempo);
      statusEl.textContent = 'BPM自動判定: ' + Math.round(tempo) + '（違っていれば直せます）';
      ctx.close();
    } catch (e) { statusEl.textContent = ''; }
  });
</script>

<script>
async function refresh(){
  const s = await (await fetch('/api/staff-me')).json();
  if(s.staff){
    document.getElementById('loginCard').classList.add('hide');
    document.getElementById('uploadCard').classList.remove('hide');
    document.getElementById('who').textContent = s.name + ' としてログイン中'+(s.role==='admin'?'（管理者）':'');
    loadProducers(); loadTypeBeats();
  } else {
    document.getElementById('loginCard').classList.remove('hide');
    document.getElementById('uploadCard').classList.add('hide');
  }
}
async function login(){
  const name=document.getElementById('name').value, password=document.getElementById('password').value;
  const r=await fetch('/api/staff-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,password})});
  const d=await r.json();
  if(r.ok){ refresh(); } else { const e=document.getElementById('loginErr'); e.textContent=d.error||'エラー'; e.style.display='block'; }
}
async function loadProducers(){
  let list=[]; try{ list=await (await fetch('/api/producers')).json(); }catch(e){}
  const sel=document.getElementById('uploader'); if(!sel) return;
  const cur=sel.value;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  sel.innerHTML='<option value="">選択…</option>'+(list||[]).map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
  if(cur) sel.value=cur;
}
const TYPEBEAT_SEED = ['Travis Scott','Playboi Carti','Central Cee','Juice WRLD','Drake','Lil Baby','Gunna','Ken Carson','Yeat','Metro Boomin','21 Savage','Don Toliver'];
async function loadTypeBeats(){
  let used=[]; try{ used=await (await fetch('/api/typebeats')).json(); }catch(e){}
  const all=[...new Set([...(used||[]), ...TYPEBEAT_SEED])].sort((a,b)=>a.localeCompare(b));
  const sel=document.getElementById('typebeat'); if(!sel) return;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  sel.innerHTML='<option value="">指定なし</option>'
    + all.map(n=>'<option value="'+esc(n)+'">'+esc(n)+' type beat</option>').join('')
    + '<option value="__new__">＋ 新しく追加…</option>';
}
function onTypeBeatChange(){
  const sel=document.getElementById('typebeat'), nw=document.getElementById('typebeatNew');
  if(sel.value==='__new__'){ nw.classList.remove('hide'); nw.focus(); } else { nw.classList.add('hide'); }
}
function currentTypeBeat(){
  const sel=document.getElementById('typebeat');
  if(sel.value==='__new__') return document.getElementById('typebeatNew').value.trim();
  return sel.value;
}
async function submitBeat(){
  const f=document.getElementById('file').files[0];
  const title=document.getElementById('title').value.trim();
  const ok=document.getElementById('okMsg'), err=document.getElementById('errMsg'); ok.style.display='none'; err.style.display='none';
  if(!f){ err.textContent='mp3ファイルを選んでください'; err.style.display='block'; return; }
  if(!title){ err.textContent='タイトルを入力してください'; err.style.display='block'; return; }
  const uploader=document.getElementById('uploader').value;
  if(!uploader){ err.textContent='投稿者を選んでください'; err.style.display='block'; return; }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='アップロード中…（試聴を作成しています）';
  const fd=new FormData();
  fd.append('beat',f); fd.append('title',title);
  fd.append('uploader',uploader);
  fd.append('type_beat',currentTypeBeat());
  fd.append('genre',document.getElementById('genre').value);
  fd.append('bpm',document.getElementById('bpm').value);
  fd.append('key',document.getElementById('key').value);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd}); const d=await r.json();
    if(r.ok){ ok.textContent='投稿しました！承認されると公開されます。'; ok.style.display='block';
      document.getElementById('file').value=''; document.getElementById('title').value='';
      document.getElementById('genre').value=''; document.getElementById('bpm').value=''; document.getElementById('key').value='';
      const _nw=document.getElementById('typebeatNew'); _nw.value=''; _nw.classList.add('hide');
      document.getElementById('typebeat').value=''; loadTypeBeats();
    } else { err.textContent=d.error||'エラー'; err.style.display='block'; }
  }catch(e){ err.textContent='通信エラー'; err.style.display='block'; }
  btn.disabled=false; btn.textContent='投稿する（承認待ちになります）';
}
refresh();
</script>
</body>
</html>
