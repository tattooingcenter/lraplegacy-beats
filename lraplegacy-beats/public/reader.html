<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050806; --bg2:#070c09; --panel:#0d1410; --panel2:#121c16;
    --line:#202c25; --line2:#2c3b32; --ink:#eef4f0; --sub:#8ba093; --dim:#5f6f66;
    --accent:#2fbb74; --accent2:#5fe3a1; --gold:#e8c96a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px}
  svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.14em;flex:none}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:rgba(255,255,255,.02);border:1px solid var(--line2);color:var(--ink);font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer;font-size:14px;transition:.15s}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent2)}

  header{position:sticky;top:0;z-index:20;background:rgba(5,8,6,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:13px}
  .logo span{white-space:nowrap}
  .logo b{color:var(--accent2)}
  .logomark{width:32px;height:32px;border-radius:9px;object-fit:cover;display:block;box-shadow:0 0 0 1px var(--line),0 4px 14px -6px rgba(47,187,116,.5)}
  .navright{display:flex;align-items:center;gap:7px}
  @media(max-width:400px){ .logo span{display:none} }
  .langtoggle{background:transparent;border:1px solid var(--line2);color:var(--sub);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}
  .langtoggle:hover{color:var(--ink)}

  section{padding:26px 0 56px;position:relative}
  .h2{font-size:22px;font-weight:800;letter-spacing:.01em}
  .lead{color:var(--sub);margin:6px 0 20px;font-size:14px}

  .memberbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px 0 16px}
  .status{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
  .status b{color:var(--accent2)}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .status.in .dot{background:var(--accent2);box-shadow:0 0 0 4px rgba(95,227,161,.15)}
  .loginrow{display:flex;gap:8px;flex-wrap:wrap}
  .loginrow input{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:11px 15px;font-size:14px;min-width:210px;outline:none}
  .loginrow input:focus{border-color:var(--accent)}

  .searchrow{position:relative;margin:0 0 14px}
  .searchrow .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px;pointer-events:none}
  .searchrow input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:14px 44px 14px 44px;font-size:15px;outline:none;transition:.15s}
  .searchrow input:focus{border-color:var(--accent);background:var(--panel2)}
  .searchrow .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim);background:none;border:none;cursor:pointer;font-size:17px;display:none}
  .searchrow .clr.show{display:block}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .pl{background:var(--panel);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
  .pl:hover{color:var(--ink);border-color:var(--line2)}
  .pl.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04160d;border-color:transparent}
  .pl small{opacity:.7;font-weight:700;margin-left:6px}

  .beats{display:flex;flex-direction:column;gap:8px}
  .beatrow{display:flex;align-items:center;gap:14px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:.15s;cursor:pointer}
  .beatrow:hover{border-color:var(--line2);background:var(--panel2)}
  .beatrow.active{border-color:var(--accent)}
  .art{width:54px;height:54px;border-radius:11px;flex:none;position:relative;display:grid;place-items:center;overflow:hidden;color:#fff}
  .art .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;opacity:.85}
  .art .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.42);color:#fff;font-size:20px;opacity:0;transition:.15s;border:none;cursor:pointer}
  .beatrow:hover .art .ov{opacity:1}
  .art.playing .ov{opacity:1;background:rgba(0,0,0,.5);color:var(--accent2)}
  .beatmeta{flex:1;min-width:0}
  .beatmeta b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .beatmeta .sub{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .beatmeta .tb{color:var(--accent2);font-weight:700}
  .beatmeta .prev{color:var(--gold);font-weight:700}
  .rowbtns{display:flex;align-items:center;gap:8px;flex:none}
  .dl{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--accent2);border:1px solid var(--line2);border-radius:10px;padding:9px 15px;cursor:pointer;white-space:nowrap;background:transparent;transition:.15s}
  .dl:hover{border-color:var(--accent);background:rgba(47,187,116,.08)}
  .dl.locked{color:var(--dim)}
  .dl .lbl{display:inline}
  @media(max-width:520px){ .dl .lbl{display:none} .dl{padding:10px} }
  .emptybeats{text-align:center;color:var(--dim);padding:44px 0;font-size:14px}
  #player{display:none}
  body.has-player #member{padding-bottom:96px}

  .playerbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(9,14,11,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:13px;transform:translateY(120%);transition:transform .25s}
  body.has-player .playerbar{transform:none}
  .playerbar .seek{position:absolute;top:0;left:0;right:0;height:4px;background:var(--line);cursor:pointer}
  .playerbar .seek .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .pbart{width:46px;height:46px;border-radius:9px;flex:none;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;cursor:pointer}
  .pbart .pic{font-size:17px;opacity:.85}
  .pbinfo{flex:1;min-width:0;cursor:pointer}
  .pbinfo b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbinfo .sub{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbtime{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
  .pbplay{width:44px;height:44px;border-radius:50%;flex:none;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04160d;display:grid;place-items:center;font-size:19px}
  @media(max-width:520px){ .pbtime{display:none} }

  .detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .28s;display:none}
  .detail.open{display:block;transform:none}
  .dhead{position:sticky;top:0;background:rgba(5,8,6,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
  .dback{background:none;border:none;color:var(--ink);cursor:pointer;font-size:22px;display:grid;place-items:center;padding:4px}
  .dhead .dh-title{font-weight:800;font-size:14px;color:var(--sub);letter-spacing:.04em}
  .dbody{max-width:560px;margin:0 auto;padding:26px 22px 120px}
  .dart{width:100%;max-width:300px;aspect-ratio:1;border-radius:20px;margin:0 auto 22px;display:grid;place-items:center;color:#fff;font-size:56px;box-shadow:0 24px 60px -24px rgba(0,0,0,.8);overflow:hidden}
  .dtitle{font-size:26px;font-weight:800;text-align:center;letter-spacing:.01em}
  .dprod{color:var(--sub);text-align:center;margin-top:4px;font-size:14px}
  .dtags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px}
  .dtag{font-size:12px;font-weight:700;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .dtag.accent{color:var(--accent2);border-color:rgba(47,187,116,.3);background:rgba(47,187,116,.08)}
  .wave{display:flex;align-items:center;gap:2px;height:66px;margin:24px 0 8px;cursor:pointer}
  .wave .bar{flex:1;background:var(--line2);border-radius:2px;transition:background .05s}
  .wave .bar.on{background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .dtime{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:22px}
  .dactions{display:flex;gap:12px;align-items:center;justify-content:center}
  .dplay{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04160d;display:grid;place-items:center;font-size:26px;box-shadow:0 12px 30px -10px rgba(47,187,116,.7)}
  .dnote{color:var(--dim);font-size:12.5px;text-align:center;margin-top:18px}
</style>
</head>
<body>

<section id="member"><div class="wrap">
  <div class="h2" id="mTitle"></div>
  <div class="lead" id="mLead"></div>
  <div class="memberbar" id="memberbar">
    <div class="status" id="statusText"></div>
    <div class="loginrow" id="loginrow" style="display:none">
      <input id="email" type="email" autocomplete="email"><button class="btn-ghost" onclick="login()"><span id="loginBtnT"></span></button>
    </div>
  </div>
  <div class="searchrow">
    <span class="si" id="searchIcon"></span>
    <input id="search" type="text" oninput="onSearch(this.value)" autocomplete="off">
    <button class="clr" id="searchClr" onclick="clearSearch()"></button>
  </div>
  <div class="filters" id="playlists"></div>
  <div class="beats" id="beatlist"></div>
  <audio id="player" preload="metadata"></audio>
</div></section>

<div class="playerbar" id="playerbar" aria-hidden="true">
  <div class="seek" id="seek" onclick="seekAt(event)"><div class="fill" id="seekFill"></div></div>
  <div class="pbart" id="pbArt" onclick="openDetail(CURRENT)"><span class="pic" id="pbArtPic"></span></div>
  <div class="pbinfo" onclick="openDetail(CURRENT)"><b id="pbTitle"></b><div class="sub" id="pbSub"></div></div>
  <span class="pbtime" id="pbTime">0:00</span>
  <button class="pbplay" id="pbPlay" onclick="togglePlay()"></button>
</div>

<div class="detail" id="detail" aria-hidden="true">
  <div class="dhead">
    <button class="dback" onclick="closeDetail()" id="dBack"></button>
    <span class="dh-title" id="dHeadTitle"></span>
  </div>
  <div class="dbody">
    <div class="dart" id="dArt"><span id="dArtPic"></span></div>
    <div class="dtitle" id="dTitle"></div>
    <div class="dprod" id="dProd"></div>
    <div class="dtags" id="dTags"></div>
    <div class="wave" id="wave" onclick="seekAt(event)"></div>
    <div class="dtime"><span id="dCur">0:00</span><span id="dDur">0:00</span></div>
    <div class="dactions">
      <button class="dplay" id="dPlay" onclick="detailPlay()"></button>
      <button class="dl" id="dDl" onclick="download(DETAIL)"></button>
    </div>
    <div class="dnote" id="dNote"></div>
  </div>
</div>

<script>
/* Legacy Beats reader-only app page: login + beat library. No purchase code. */
const ICONS = {
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  back:'<path d="m15 18-6-6 6-6"/>'
};
function icon(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'; }

const I18N = {
  ja:{ title:'ビートライブラリ', lead:'ログインするとダウンロードが開きます。', email_ph:'登録したメールアドレス', login_btn:'ログイン',
    search_ph:'ビートを検索（曲名・ジャンル・タグ・キー）', nav_login:'ログイン', nav_logout:'ログアウト',
    status_in:e=>'<span class="dot"></span>ログイン中 — <b>'+e+'</b>', status_out:'<span class="dot"></span>未ログイン',
    dl_member:'ダウンロード', dl_locked:'会員限定', preview_ok:'7秒試聴OK', empty:'ただいまビートを準備中です。',
    noresult:'該当するビートがありません。', all_label:'すべて', prod_label:'Produced by', detail_head:'BEAT',
    dl_note_member:'会員はフル尺をダウンロードできます', dl_note_guest:'試聴は7秒。ダウンロードは会員限定です。', langlabel:'EN' },
  en:{ title:'Beat library', lead:'Sign in to unlock downloads.', email_ph:'Your registered email', login_btn:'Sign in',
    search_ph:'Search beats (title, genre, tag, key)', nav_login:'Sign in', nav_logout:'Sign out',
    status_in:e=>'<span class="dot"></span>Signed in — <b>'+e+'</b>', status_out:'<span class="dot"></span>Not signed in',
    dl_member:'Download', dl_locked:'Members', preview_ok:'7-sec preview', empty:'Beats are being prepared.',
    noresult:'No beats match your search.', all_label:'All', prod_label:'Produced by', detail_head:'BEAT',
    dl_note_member:'Members can download the full track', dl_note_guest:'Preview is 7 sec. Download is members only.', langlabel:'日本語' }
};
let LANG=(navigator.language||'').toLowerCase().startsWith('ja')?'ja':'en';
let ME={member:false,email:null};
function t(){ return I18N[LANG]; }
const S=id=>document.getElementById(id);

function applyI18n(){
  document.documentElement.lang=LANG;
  S('mTitle').textContent=t().title;
  S('mLead').textContent=t().lead;
  S('email').placeholder=t().email_ph;
  S('loginBtnT').textContent=t().login_btn;
  S('search').placeholder=t().search_ph;
  S('searchIcon').innerHTML=icon('search');
  S('searchClr').innerHTML=icon('x');
  S('langBtn').textContent=t().langlabel;
  S('dBack').innerHTML=icon('back');
  S('dHeadTitle').textContent=t().detail_head;
  renderAuth(); loadBeats(); if(DETAIL) renderDetail();
}
function toggleLang(){ LANG=LANG==='ja'?'en':'ja'; applyI18n(); }

function renderAuth(){
  document.body.classList.toggle('is-member', !!ME.member);
  const nav=S('navauth'), st=S('statusText'), row=S('loginrow');
  if(ME.member){
    nav.innerHTML='<a class="btn-ghost" href="/logout">'+icon('logout')+'<span>'+t().nav_logout+'</span></a>';
    st.classList.add('in'); st.innerHTML=t().status_in(ME.email||''); row.style.display='none';
  } else {
    nav.innerHTML=''; st.classList.remove('in'); st.innerHTML=t().status_out; row.style.display='flex';
  }
}

let CATALOG=[], TYPE_FILTER=null, QUERY='', CURRENT=null, DETAIL=null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function beatById(id){ return CATALOG.find(b=>b.id===id); }
function artFor(b){ let h=0; const s=String((b&&b.id)||'x'); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; const a=h%360,b2=(a+42)%360; return 'linear-gradient(135deg,hsl('+a+' 55% 30%),hsl('+b2+' 60% 16%))'; }
async function loadBeats(){
  try{ CATALOG=await (await fetch('/api/catalog')).json(); }catch(e){ CATALOG=[]; }
  if(TYPE_FILTER && !CATALOG.some(b=>b.type_beat===TYPE_FILTER)) TYPE_FILTER=null;
  renderPlaylists(); renderBeatList();
}
function typeCounts(){ const m=new Map(); CATALOG.forEach(b=>{ if(b.type_beat) m.set(b.type_beat,(m.get(b.type_beat)||0)+1); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function visibleBeats(){ let arr=TYPE_FILTER===null?CATALOG.slice():CATALOG.filter(b=>b.type_beat===TYPE_FILTER); if(QUERY){ const q=QUERY.toLowerCase(); arr=arr.filter(b=>[b.title,b.genre,b.key,b.type_beat].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))); } return arr; }
function onSearch(v){ QUERY=v.trim(); S('searchClr').classList.toggle('show',!!QUERY); renderBeatList(); }
function clearSearch(){ QUERY=''; S('search').value=''; S('searchClr').classList.remove('show'); renderBeatList(); S('search').focus(); }
function renderPlaylists(){
  const el=S('playlists'); const counts=typeCounts(); if(!counts.length){ el.innerHTML=''; return; }
  let html='<div class="pl'+(TYPE_FILTER===null?' active':'')+'" data-type="">'+t().all_label+' <small>'+CATALOG.length+'</small></div>';
  html+=counts.map(([n,c])=>'<div class="pl'+(TYPE_FILTER===n?' active':'')+'" data-type="'+esc(n)+'">'+esc(n)+' <small>'+c+'</small></div>').join('');
  el.innerHTML=html;
  el.onclick=e=>{ const c=e.target.closest('.pl'); if(!c)return; const ty=c.getAttribute('data-type'); TYPE_FILTER=ty===''?null:ty; renderPlaylists(); renderBeatList(); };
}
function metaLine(b){ return [b.genre,b.bpm?b.bpm+' BPM':'',b.key].filter(Boolean).join(' · '); }
function renderBeatList(){
  const list=S('beatlist'); const beats=visibleBeats();
  if(!beats.length){ list.innerHTML='<div class="emptybeats">'+icon(QUERY?'search':'music')+'　'+(QUERY?t().noresult:t().empty)+'</div>'; return; }
  list.innerHTML=beats.map(b=>{
    const tb=b.type_beat?('<span class="tb"> · '+esc(b.type_beat)+' type</span>'):'';
    const prev=ME.member?'':(' · <span class="prev">'+t().preview_ok+'</span>');
    const on=(CURRENT===b.id)?' playing':''; const rowon=(CURRENT===b.id)?' active':'';
    return '<div class="beatrow'+rowon+'" onclick="openDetail(\''+b.id+'\')">'
      +'<div class="art'+on+'" style="background:'+artFor(b)+'" onclick="event.stopPropagation();toggleBeat(\''+b.id+'\')"><span class="pic">'+icon('music')+'</span><button class="ov">'+icon(on?'pause':'play')+'</button></div>'
      +'<div class="beatmeta"><b>'+esc(b.title)+'</b><div class="sub">'+metaLine(b)+tb+prev+'</div></div>'
      +'<div class="rowbtns"><button class="dl '+(ME.member?'':'locked')+'" onclick="event.stopPropagation();download(\''+b.id+'\')">'+(ME.member?icon('download'):icon('lock'))+'<span class="lbl">'+(ME.member?t().dl_member:t().dl_locked)+'</span></button></div>'
    +'</div>';
  }).join('');
}

const AU=()=>S('player');
function srcFor(id){ return (ME.member?'/api/stream/':'/api/preview/')+id; }
function fmt(s){ if(!isFinite(s)||s<0)s=0; const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }
function loadTrack(id){ const b=beatById(id); if(!b)return; CURRENT=id; const au=AU(); au.src=srcFor(id); au.play().catch(()=>{}); document.body.classList.add('has-player'); renderPlayerBar(); renderBeatList(); if(DETAIL) renderDetail(); }
function toggleBeat(id){ if(CURRENT===id) togglePlay(); else loadTrack(id); }
function togglePlay(){ const au=AU(); if(!CURRENT)return; if(au.paused) au.play().catch(()=>{}); else au.pause(); }
function renderPlayerBar(){ const b=beatById(CURRENT); if(!b)return; S('pbArt').style.background=artFor(b); S('pbArtPic').innerHTML=icon('music'); S('pbTitle').textContent=b.title; S('pbSub').textContent=metaLine(b); updatePlayIcons(); }
function updatePlayIcons(){ const paused=AU().paused; S('pbPlay').innerHTML=icon(paused?'play':'pause'); const dp=S('dPlay'); if(dp) dp.innerHTML=icon((paused||DETAIL!==CURRENT)?'play':'pause'); renderBeatList(); }
function seekAt(e){ const au=AU(); if(!au.duration)return; const el=e.currentTarget,r=el.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); au.currentTime=ratio*au.duration; }
function onTime(){ const au=AU(),d=au.duration||0,c=au.currentTime||0,ratio=d?c/d:0; S('seekFill').style.width=(ratio*100)+'%'; S('pbTime').textContent=fmt(c); if(DETAIL===CURRENT){ S('dCur').textContent=fmt(c); S('dDur').textContent=fmt(d); const bars=document.querySelectorAll('#wave .bar'); const cut=Math.floor(ratio*bars.length); bars.forEach((bar,i)=>bar.classList.toggle('on',i<=cut)); } }

function waveHeights(id){ let h=0; const s=String(id); for(let i=0;i<s.length;i++) h=(h*131+s.charCodeAt(i))>>>0; const out=[]; for(let i=0;i<56;i++){ h=(h*1103515245+12345)&0x7fffffff; out.push(24+(h%76)); } return out; }
function openDetail(id){ if(!id)return; DETAIL=id; renderDetail(); const d=S('detail'); d.classList.add('open'); d.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
function closeDetail(){ const d=S('detail'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); document.body.style.overflow=''; DETAIL=null; }
function renderDetail(){
  const b=beatById(DETAIL); if(!b)return;
  S('dArt').style.background=artFor(b); S('dArtPic').innerHTML=icon('music'); S('dTitle').textContent=b.title;
  S('dProd').textContent=b.uploader?(t().prod_label+' '+b.uploader):'L RAP LEGACY';
  const tags=[]; if(b.type_beat) tags.push('<span class="dtag accent">'+esc(b.type_beat)+' type</span>'); if(b.genre) tags.push('<span class="dtag">'+esc(b.genre)+'</span>'); if(b.bpm) tags.push('<span class="dtag">'+b.bpm+' BPM</span>'); if(b.key) tags.push('<span class="dtag">'+esc(b.key)+'</span>');
  S('dTags').innerHTML=tags.join('');
  S('wave').innerHTML=waveHeights(b.id).map(h=>'<div class="bar" style="height:'+h+'%"></div>').join('');
  S('dDl').innerHTML=(ME.member?icon('download'):icon('lock'))+'<span class="lbl">'+(ME.member?t().dl_member:t().dl_locked)+'</span>';
  S('dDl').className='dl '+(ME.member?'':'locked');
  S('dNote').textContent=ME.member?t().dl_note_member:t().dl_note_guest;
  updatePlayIcons(); onTime();
}
function detailPlay(){ if(!DETAIL)return; if(CURRENT===DETAIL) togglePlay(); else loadTrack(DETAIL); }

async function login(){ const email=S('email').value; const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}); const d=await r.json(); if(r.ok) init(); else alert(d.error||'error'); }
function download(id){ if(!ME.member){ closeDetail(); S('email').focus(); return; } location.href='/api/download/'+id; }

async function init(){ try{ ME=await (await fetch('/api/me')).json(); }catch(e){} applyI18n(); }
window.addEventListener('DOMContentLoaded',()=>{
  const au=AU();
  au.addEventListener('timeupdate',onTime);
  au.addEventListener('play',updatePlayIcons);
  au.addEventListener('pause',updatePlayIcons);
  au.addEventListener('loadedmetadata',onTime);
  au.addEventListener('ended',()=>{ const list=visibleBeats(); const i=list.findIndex(b=>b.id===CURRENT); if(i>=0&&i<list.length-1) loadTrack(list[i+1].id); else updatePlayIcons(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&DETAIL) closeDetail(); });
});
init();
</script>
</body>
</html>
