<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L RAP LEGACY BEATS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080d0a;--panel:#0f1712;--panel2:#152019;--line:#26332c;--ink:#eef4f0;--sub:#93a89c;--accent:#2fbb74;--accent2:#5fe3a1;--yellow:#f5e14b;--green:#3ad29f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .btn{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111;font-weight:800;padding:14px 28px;border-radius:999px;border:none;cursor:pointer;font-size:16px;transition:transform .12s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .tag{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--accent2);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,14,.85);backdrop-filter:blur(8px);z-index:10}
  .nav{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
  .logo{font-weight:900;letter-spacing:.12em;font-size:15px}
  .logo b{color:var(--accent2)}
  .navright{display:flex;align-items:center;gap:8px}
  .langtoggle{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700}
  .hero{padding:74px 0 52px;text-align:center;background:radial-gradient(1000px 420px at 50% -10%,rgba(47,187,116,.18),transparent)}
  .hero h1{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:clamp(33px,6.2vw,60px);font-weight:900;line-height:1.16;letter-spacing:.01em}
  .hero h1 span{color:var(--accent2)}
  .hero p{color:var(--sub);font-size:18px;margin:18px auto 0;max-width:600px}
  .cta{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .badges{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  section{padding:52px 0}
  .h2{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:26px;font-weight:800;text-align:center;margin-bottom:8px}
  .lead{color:var(--sub);text-align:center;max-width:560px;margin:0 auto 30px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card .ic{font-size:24px;margin-bottom:10px}.card h3{font-size:16px;margin-bottom:6px}.card p{color:var(--sub);font-size:14px}
  .price{max-width:440px;margin:0 auto;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--accent);border-radius:22px;padding:34px;text-align:center;position:relative;overflow:hidden}
  .price .founder{position:absolute;top:16px;right:-42px;transform:rotate(45deg);background:var(--yellow);color:#111;font-weight:800;font-size:12px;padding:6px 54px}
  .emblem{vertical-align:middle;margin-right:9px}
  .price .amt{font-size:50px;font-weight:900;margin:6px 0}.price .amt small{font-size:18px;color:var(--sub);font-weight:600}
  .price ul{list-style:none;text-align:left;margin:20px 0;display:inline-block}
  .price li{padding:6px 0;font-size:15px}.price li::before{content:"✓";color:var(--green);font-weight:900;margin-right:10px}
  .beats{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .beatrow{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .beatrow:last-child{border-bottom:none}
  .play{width:42px;height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none;cursor:pointer}
  .beatmeta{flex:1;min-width:0}.beatmeta b{display:block;font-size:15px}.beatmeta span{color:var(--sub);font-size:12px}
  .dl{font-size:13px;font-weight:700;color:var(--accent2);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap;background:transparent}
  .memberbox{background:var(--panel2);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;margin-bottom:20px}
  .memberbox.in{border-style:solid;border-color:var(--green)}
  .status{font-size:13px;color:var(--sub)}.status b{color:var(--green)}
  .loginrow{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .loginrow input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:14px;min-width:220px}
  .faq{max-width:640px;margin:0 auto}
  .faq details{border-bottom:1px solid var(--line);padding:15px 0}
  .faq summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}.faq summary::-webkit-details-marker{display:none}
  .faq p{color:var(--sub);font-size:14px;margin-top:9px}
  footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--sub);font-size:13px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo"><svg class="emblem" width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="lrlg" cx="42%" cy="34%" r="82%"><stop offset="0%" stop-color="#1a5a3e"/><stop offset="100%" stop-color="#05120d"/></radialGradient></defs><circle cx="50" cy="50" r="47" fill="url(#lrlg)" stroke="#2b4034" stroke-width="1.5"/><g fill="#e6fff1"><rect x="37" y="25" width="13" height="20" rx="3"/><rect x="37" y="49" width="13" height="27" rx="3"/><rect x="37" y="63" width="38" height="13" rx="3"/></g></svg>L RAP LEGACY <b>BEATS</b></div>
  <div class="navright">
    <button class="langtoggle" id="langBtn" onclick="toggleLang()"></button>
    <div id="navauth"></div>
  </div>
</div></header>

<section class="hero"><div class="wrap">
  <div class="tag" data-i18n="badge"></div>
  <h1 id="heroH1"></h1>
  <p data-i18n="hero_p"></p>
  <div class="cta">
    <button class="btn" onclick="join()" data-i18n="cta_join"></button>
    <button class="btn btn-ghost" onclick="go('member')" data-i18n="cta_view"></button>
  </div>
  <div class="badges">
    <span class="tag" data-i18n="badge1"></span><span class="tag" data-i18n="badge2"></span><span class="tag" data-i18n="badge3"></span>
  </div>
</div></section>

<section><div class="wrap">
  <div class="h2" data-i18n="reasons_title"></div>
  <div class="lead" data-i18n="reasons_lead"></div>
  <div class="grid">
    <div class="card"><div class="ic">🎯</div><h3 data-i18n="card1_h"></h3><p data-i18n="card1_p"></p></div>
    <div class="card"><div class="ic">♾️</div><h3 data-i18n="card2_h"></h3><p data-i18n="card2_p"></p></div>
    <div class="card"><div class="ic">💼</div><h3 data-i18n="card3_h"></h3><p data-i18n="card3_p"></p></div>
  </div>
</div></section>

<section id="join"><div class="wrap">
  <div class="h2" data-i18n="join_title"></div>
  <div class="lead" data-i18n="join_lead"></div>
  <div class="price">
    <div class="founder">FOUNDER</div>
    <div class="tag" data-i18n="price_tag"></div>
    <div class="amt"><span id="priceAmt">—</span><small data-i18n="price_per"></small></div>
    <ul>
      <li data-i18n="feat1"></li><li data-i18n="feat2"></li><li data-i18n="feat3"></li><li data-i18n="feat4"></li>
    </ul>
    <div><button class="btn" id="joinbtn" onclick="join()" data-i18n="price_btn"></button></div>
    <div class="status" style="margin-top:12px" data-i18n="price_note"></div>
  </div>
</div></section>

<section id="member"><div class="wrap">
  <div class="h2" data-i18n="member_title"></div>
  <div class="lead" data-i18n="member_lead"></div>
  <div class="memberbox" id="memberbox">
    <div class="status" id="statusText"></div>
    <div class="loginrow" id="loginrow" style="display:none">
      <input id="email" type="email"><button class="btn btn-ghost" onclick="login()" data-i18n="login_btn"></button>
    </div>
  </div>
  <div class="beats" id="beatlist"></div>
  <audio id="player" style="width:100%;margin-top:14px;display:none" controls></audio>
</div></section>

<section><div class="wrap">
  <div class="h2" data-i18n="faq_title"></div>
  <div class="faq" id="faq"></div>
</div></section>

<footer>© L RAP LEGACY BEATS ・ <a id="tokushoLink" href="https://secret-acorn-5f5.notion.site/3b4c349c90d380c0af72dfb637d92488" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:none"></a></footer>

<script>
const I18N = {
  ja: {
    badge:'日本語対応・商用利用OK',
    hero_h1:'日本のシーンのための<br><span>ビート、使い放題。</span>',
    hero_p:'毎月追加されるオリジナルビートを、会員だけがダウンロード。1曲ずつ買う時代は終わり。月額で、好きなだけ。',
    cta_join:'創設メンバーになる', cta_view:'会員画面を見る',
    badge1:'先着10名・価格据え置き', badge2:'毎月ビート追加', badge3:'日本語サポート',
    reasons_title:'選ばれる3つの理由',
    reasons_lead:'海外大手が「分かりにくい・シーンに合わない・相談できない」なら、その逆をやる。',
    card1_h:'ぜんぶ分かりやすい', card1_p:'ライセンスも使い方も明快。困ったら直接相談OK。',
    card2_h:'使い放題', card2_p:'会員期間中は何曲でもDL。月額の定額で好きなだけ。',
    card3_h:'商用利用OK', card3_p:'配信・ライブ・動画に使える。あなたの曲として世に出せる。',
    join_title:'創設メンバー募集',
    join_lead:'先着10名。今後値上げしても、この価格のまま据え置き。要望は直接反映します。',
    price_tag:'創設メンバー価格', price_per:'／月',
    feat1:'毎月追加されるビートを使い放題', feat2:'商用利用OK（配信・ライブ・動画）',
    feat3:'要望・リクエストを直接反映', feat4:'いつでも解約OK',
    price_btn:'Stripeで登録する', price_note:'安全な決済（Stripe）・登録後すぐ会員画面へ',
    member_title:'会員ダウンロード', member_lead:'会員だけの部屋。ログイン中はDLが開きます。',
    email_ph:'登録したメールアドレス', login_btn:'ログイン',
    nav_login:'会員ログイン', nav_logout:'ログアウト',
    status_in:(e)=>'現在: <b>ログイン中</b> — '+e+' / DLできます',
    status_out:'現在: <b style="color:var(--sub)">未ログイン</b> — DLはロックされています',
    dl_member:'⬇ ダウンロード', dl_locked:'🔒 DLは会員限定', preview_ok:' · 試聴OK',
    play_member:'再生', play_prev:'7秒 試聴',
    faq:[['ダウンロードしたビートは商用利用できますか？','はい。会員期間中にDLしたビートは配信・ライブ・動画などに使えます（規約の範囲内）。'],
         ['ビートは毎月増えますか？','はい。毎月オリジナルビートを追加します。会員はすべて使い放題です。'],
         ['解約はできますか？','いつでも解約できます。創設メンバーの据え置き価格は継続中ずっと有効です。']],
    tokusho:'特定商取引法に基づく表記',
    langlabel:'EN'
  },
  en: {
    badge:'Made for the scene · Commercial use OK',
    hero_h1:'Unlimited beats,<br><span>ready for your track.</span>',
    hero_p:'Fresh original beats every month, downloadable by members only. Stop buying one at a time — get them all, one monthly price.',
    cta_join:'Become a founding member', cta_view:'See the member area',
    badge1:'First 10 · price locked', badge2:'New beats monthly', badge3:'Real human support',
    reasons_title:'Why producers choose us',
    reasons_lead:'Everything the big marketplaces make hard — clear terms, a real catalog, real support — made simple.',
    card1_h:'Clear & simple', card1_p:'Licensing and usage made clear. Ask us anything, anytime.',
    card2_h:'Unlimited', card2_p:'Download as many as you want while you are a member. One flat monthly price.',
    card3_h:'Commercial use OK', card3_p:'Use them for streaming, shows, and videos. Release them as your own.',
    join_title:'Founding members',
    join_lead:'First 10 members only. Your price stays locked even if we raise it later. We build around your requests.',
    price_tag:'Founding price', price_per:'/mo',
    feat1:'Unlimited access to new monthly beats', feat2:'Commercial use (streaming, shows, video)',
    feat3:'Your requests shape the catalog', feat4:'Cancel anytime',
    price_btn:'Join with Stripe', price_note:'Secure checkout by Stripe · instant access',
    member_title:'Member downloads', member_lead:'Members only. Downloads unlock when you are signed in.',
    email_ph:'Your registered email', login_btn:'Sign in',
    nav_login:'Member sign in', nav_logout:'Sign out',
    status_in:(e)=>'Signed in — <b>'+e+'</b> / downloads unlocked',
    status_out:'Not signed in — downloads are locked',
    dl_member:'⬇ Download', dl_locked:'🔒 Members only', preview_ok:' · Preview',
    play_member:'Play', play_prev:'7-sec preview',
    faq:[['Can I use downloaded beats commercially?','Yes. Beats you download while a member can be used for streaming, shows, and videos (per the terms).'],
         ['Do you add beats every month?','Yes. We add original beats every month, all unlimited for members.'],
         ['Can I cancel?','Anytime. Founding-member pricing stays locked as long as you keep your membership.']],
    tokusho:'特定商取引法に基づく表記 (Japanese legal notice)',
    langlabel:'日本語'
  }
};
let LANG = (navigator.language||'').toLowerCase().startsWith('ja') ? 'ja' : 'en';
let ME = {member:false, email:null};
let PRICE_DISPLAY = '';

function t(){ return I18N[LANG]; }
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t()[el.getAttribute('data-i18n')]; });
  document.getElementById('heroH1').innerHTML = t().hero_h1;
  document.getElementById('email').placeholder = t().email_ph;
  document.getElementById('langBtn').textContent = t().langlabel;
  document.getElementById('tokushoLink').textContent = t().tokusho;
  if(PRICE_DISPLAY) document.getElementById('priceAmt').textContent = PRICE_DISPLAY;
  document.getElementById('faq').innerHTML = t().faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  renderAuth(); loadBeats();
}
function toggleLang(){ LANG = LANG==='ja'?'en':'ja'; applyI18n(); }

function renderAuth(){
  const nav=document.getElementById('navauth'), box=document.getElementById('memberbox'),
        st=document.getElementById('statusText'), loginrow=document.getElementById('loginrow');
  if(ME.member){
    nav.innerHTML = '<a class="btn btn-ghost" href="/logout">'+t().nav_logout+'</a>';
    box.classList.add('in'); st.innerHTML = t().status_in(ME.email||'');
    loginrow.style.display='none';
  } else {
    nav.innerHTML = '<button class="btn btn-ghost" onclick="go(\'member\')">'+t().nav_login+'</button>';
    box.classList.remove('in'); st.innerHTML = t().status_out; loginrow.style.display='flex';
  }
}
async function loadBeats(){
  const list=document.getElementById('beatlist');
  let beats=[]; try{ beats=await (await fetch('/api/catalog')).json(); }catch(e){}
  list.className='beats';
  const hint = ME.member ? '' : ('<span style="color:var(--yellow)">'+t().preview_ok+'</span>');
  list.innerHTML = beats.map(b=>`
    <div class="beatrow">
      <div class="play" onclick="play('${b.id}')" title="${ME.member?t().play_member:t().play_prev}">▶</div>
      <div class="beatmeta"><b>${b.title}</b><span>${[b.genre,b.bpm?b.bpm+' BPM':'',b.key].filter(Boolean).join(' · ')}${hint}</span></div>
      <button class="dl" onclick="download('${b.id}')">${ME.member?t().dl_member:t().dl_locked}</button>
    </div>`).join('');
}
async function join(){
  const btn=document.getElementById('joinbtn'); if(btn){btn.disabled=true;}
  try{ const r=await (await fetch('/api/checkout',{method:'POST'})).json(); if(r.url) location.href=r.url; else alert(r.error||'error'); }
  catch(e){ alert('network error'); }
  if(btn){btn.disabled=false; btn.textContent=t().price_btn;}
}
async function login(){
  const email=document.getElementById('email').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json(); if(r.ok) init(); else alert(d.error||'error');
}
function download(id){ if(!ME.member){go('member');return;} location.href='/api/download/'+id; }
function play(id){ const p=document.getElementById('player'); p.style.display='block'; p.src=(ME.member?'/api/stream/':'/api/preview/')+id; p.play(); }
function go(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

async function init(){
  try{ const cfg=await (await fetch('/api/config')).json(); PRICE_DISPLAY=cfg.priceDisplay||''; }catch(e){}
  try{ ME=await (await fetch('/api/me')).json(); }catch(e){}
  applyI18n();
}
init();
</script>
</body>
</html>
